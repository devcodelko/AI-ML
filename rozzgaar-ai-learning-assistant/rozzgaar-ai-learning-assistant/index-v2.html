<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>Rozzgaar AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  #rz-btn, #rz-win, #rz-win * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans','Noto Sans Devanagari','Segoe UI',Arial,sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  #rz-win {
    --brand: #C0392B;
    --brand-dark: #7B241C;
    --brand-light: #E8746A;
    --gold: #F4B942;
    --success: #2FA84F;
    --success-bg: #EAF7EE;
    --success-border: #BFE6C9;
    --bg: #FAF7F6;
    --surface: #FFFFFF;
    --text: #241412;
    --muted: #8A7876;
    --border: #F0E2E0;
  }

  /* ---- toggle button (squircle launcher) ---- */
  #rz-btn {
    position: fixed;
    bottom: 22px;
    right: 22px;
    width: 62px;
    height: 62px;
    border-radius: 20px;
    background: linear-gradient(150deg,#C0392B,#7B241C);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 14px 30px rgba(192,57,43,.42);
    z-index: 999999;
    padding: 14px;
    transition: transform .18s ease, box-shadow .18s ease, border-radius .18s ease;
  }
  #rz-btn.hidden { display: none; }
  #rz-btn:hover { transform: translateY(-2px) rotate(-4deg); border-radius: 26px; box-shadow: 0 18px 36px rgba(192,57,43,.5); }
  #rz-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  #rz-btn img { width: 100%; height: 100%; object-fit: contain; filter: brightness(0) invert(1); }

  /* ---- chat window: docked side panel ---- */
  #rz-win {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 400px;
    max-width: 100vw;
    background: var(--surface);
    box-shadow: -20px 0 60px rgba(36,20,18,.22);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 999999;
    animation: slideIn .24s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes slideIn { from{opacity:0;transform:translateX(24px)} to{opacity:1;transform:translateX(0)} }
  #rz-win.hidden { display: none; }

  @media (max-width: 520px) {
    #rz-win { width: 100vw; }
    #rz-btn { bottom: max(16px, env(safe-area-inset-bottom)); right: 16px; width: 56px; height: 56px; }
  }

  /* ---- header: gradient banner with pattern ---- */
  .rz-head {
    position: relative;
    background: linear-gradient(120deg,#7B241C,#C0392B 60%,#E8746A);
    color: #fff;
    padding: 20px 18px 22px;
    padding-top: max(20px, env(safe-area-inset-top));
    flex-shrink: 0;
    overflow: hidden;
  }
  .rz-head::before {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 88% -10%, rgba(255,255,255,.22) 0, transparent 45%),
                       radial-gradient(circle at 10% 120%, rgba(0,0,0,.12) 0, transparent 55%);
    pointer-events: none;
  }
  .rz-head-top { display: flex; align-items: center; gap: 12px; position: relative; }
  .rz-head-logo {
    width: 44px; height: 44px; border-radius: 14px;
    background: rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center;
    padding: 9px; flex-shrink: 0; position: relative;
    border: 1px solid rgba(255,255,255,.25);
  }
  .rz-head-logo img { width: 100%; height: 100%; object-fit: contain; filter: brightness(0) invert(1); }
  .rz-head-logo .online { position: absolute; bottom: -2px; right: -2px; width: 11px; height: 11px; border-radius: 50%; background: #35D07F; border: 2px solid #7B241C; }
  .rz-head-txt { flex: 1; min-width: 0; }
  .rz-head-title { font-size: 17px; font-weight: 800; letter-spacing: .1px; line-height: 1.25; }
  .rz-head-sub { font-size: 12.5px; color: #F8DAD5; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rz-close {
    background: rgba(255,255,255,.16); border: none; color: #fff;
    width: 34px; height: 34px; border-radius: 11px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background .15s ease;
  }
  #rz-close:hover { background: rgba(255,255,255,.26); }
  #rz-close:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ---- quick chips as a horizontal scroll strip in the header ---- */
  .rz-quick {
    display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 0;
    margin-top: 16px; position: relative; scrollbar-width: none;
  }
  .rz-quick::-webkit-scrollbar { display: none; }
  .rz-chip {
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28);
    padding: 8px 14px; border-radius: 20px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; color: #fff; white-space: nowrap; flex-shrink: 0;
    transition: background .12s ease, transform .1s ease;
    -webkit-user-select: none; user-select: none;
  }
  .rz-chip:hover { background: rgba(255,255,255,.24); }
  .rz-chip:active, .rz-chip.selected { background: #fff; color: var(--brand-dark); transform: scale(.96); }
  .rz-chip:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .rz-chip:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ---- messages / welcome ---- */
  .rz-msgs {
    flex: 1; padding: 20px 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 16px; background: var(--bg);
    scroll-behavior: smooth;
  }
  .rz-msgs::-webkit-scrollbar { width: 6px; }
  .rz-msgs::-webkit-scrollbar-thumb { background: #E8D3D0; border-radius: 6px; }

  .rz-welcome {
    display: flex; flex-direction: column; align-items: center;
    text-align: center; padding: 10px 4px 6px; animation: msgIn .25s ease;
  }
  .rz-welcome-logo {
    width: 58px; height: 58px; border-radius: 18px;
    background: linear-gradient(150deg,#C0392B,#7B241C);
    display: flex; align-items: center; justify-content: center;
    padding: 12px; margin-bottom: 14px;
    box-shadow: 0 10px 24px rgba(192,57,43,.3);
  }
  .rz-welcome-logo img { width: 100%; height: 100%; object-fit: contain; filter: brightness(0) invert(1); }
  .rz-welcome-title { font-size: 18.5px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
  .rz-welcome-sub { font-size: 14px; color: var(--muted); line-height: 1.55; max-width: 300px; margin-bottom: 18px; }
  .rz-welcome-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .rz-w-card {
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 16px; padding: 14px 13px; cursor: pointer; text-align: left;
    transition: border-color .15s ease, transform .12s ease, box-shadow .15s ease;
    -webkit-user-select: none; user-select: none;
  }
  .rz-w-card:hover { border-color: var(--brand-light); box-shadow: 0 8px 18px rgba(192,57,43,.12); transform: translateY(-2px); }
  .rz-w-card:active { transform: scale(.98); }
  .rz-w-card:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .rz-w-card-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: #FBEDEB; color: var(--brand); display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .rz-w-card-txt { font-size: 13.5px; font-weight: 700; color: var(--text); line-height: 1.3; }

  .rz-row { display: flex; align-items: flex-end; gap: 9px; max-width: 100%; animation: msgIn .18s ease; }
  @keyframes msgIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .rz-row.user { flex-direction: row-reverse; align-self: flex-end; }

  .rz-av { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 5px; }
  .rz-av.bot { background: var(--brand-dark); }
  .rz-av.bot img { width: 100%; height: 100%; object-fit: contain; filter: brightness(0) invert(1); }
  .rz-av.usr { background: #F0DAD8; color: var(--brand); display:flex; align-items:center; justify-content:center; }

  .rz-bub {
    max-width: 84%; padding: 12px 15px; border-radius: 4px 16px 16px 16px;
    font-size: 15px; line-height: 1.55;
    box-shadow: 0 2px 6px rgba(36,20,18,.05);
  }
  .rz-bub.user { background: linear-gradient(135deg,#C0392B,#A6362B); color: #fff; border-radius: 16px 4px 16px 16px; white-space: pre-wrap; word-break: break-word; }
  .rz-bub.bot { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-left: 3px solid var(--brand); }
  .rz-bub.bot.error { border-color: #F3C5C5; border-left-color: #B3302E; background: #FDF3F3; color: #B3302E; }

  /* ---- rendered markdown content ---- */
  .rz-content { word-break: break-word; }
  .rz-content > *:first-child { margin-top: 0 !important; }
  .rz-content > *:last-child { margin-bottom: 0 !important; }
  .rz-content p { margin: 0 0 10px; }
  .rz-content strong { font-weight: 700; }
  .rz-content em { font-style: italic; }
  .rz-content code { background: #F0E2E0; padding: 1px 5px; border-radius: 5px; font-size: 13.5px; font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }
  .rz-content .rz-h { font-weight: 800; font-size: 16px; color: var(--brand-dark); margin: 14px 0 7px; }
  .rz-content .rz-hr { height: 1px; background: var(--border); margin: 14px 0; }
  .rz-content ul.rz-list, .rz-content ol.rz-list { margin: 0 0 10px; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
  .rz-content ul.rz-list { list-style: disc; }
  .rz-content ol.rz-list { list-style: decimal; }

  .rz-content .rz-opts { display: flex; flex-direction: column; gap: 7px; margin: 4px 0 10px; }
  .rz-content .rz-opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--border); }
  .rz-content .rz-opt-letter { flex-shrink: 0; width: 22px; height: 22px; border-radius: 7px; background: var(--brand); color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .rz-content .rz-opt-text { font-size: 15px; line-height: 1.5; }

  .rz-content .rz-answer { display: flex; align-items: center; gap: 8px; background: var(--success-bg); border: 1px solid var(--success-border); color: #1F7A3B; font-weight: 700; font-size: 14px; padding: 9px 13px; border-radius: 12px; margin: 2px 0 10px; }
  .rz-content .rz-answer-badge { width: 18px; height: 18px; border-radius: 50%; background: var(--success); color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .rz-dots { display: inline-flex; align-items: center; gap: 5px; padding: 4px 0; }
  .rz-dots span { width: 7px; height: 7px; border-radius: 50%; background: #D9B8B5; animation: bounce 1.1s infinite ease-in-out; }
  .rz-dots span:nth-child(2) { animation-delay: .15s; }
  .rz-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.6} 30%{transform:translateY(-4px);opacity:1} }

  .cursor { display: inline-block; color: var(--gold); animation: blink .9s step-end infinite; margin-left: 1px; font-weight: 700; }
  .cursor::after { content: "▍"; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .rz-speak {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
    padding: 6px 12px; border: 1px solid var(--border); background: var(--bg); color: var(--brand);
    border-radius: 18px; cursor: pointer; font-size: 12.5px; font-weight: 700;
    transition: background .12s ease;
  }
  .rz-speak:hover { background: #FBEDEB; }
  .rz-speak.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .rz-speak:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* ---- input row: floating pill capsule ---- */
  .rz-input-row {
    display: flex; padding: 14px 16px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    gap: 8px; align-items: center;
    background: var(--surface); flex-shrink: 0;
    border-top: 1px solid var(--border);
  }
  .rz-input-capsule {
    flex: 1; display: flex; align-items: center; gap: 6px;
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 26px;
    padding: 4px 4px 4px 16px; transition: border-color .15s ease, background .15s ease;
  }
  .rz-input-capsule:focus-within { border-color: var(--brand); background: #fff; }
  #rz-input {
    flex: 1; padding: 10px 0; border: none; background: transparent;
    font-size: 15px; outline: none; color: var(--text);
  }
  #rz-input:disabled { opacity: .6; }
  #rz-input::placeholder { font-size: 14px; color: var(--muted); }

  #rz-mic {
    background: transparent; border: none;
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--brand); flex-shrink: 0; position: relative;
  }
  #rz-mic:hover:not(:disabled) { background: #FBEDEB; }
  #rz-mic.listening { color: #fff; background: #E4574C; }
  #rz-mic.listening::before, #rz-mic.listening::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 2px solid rgba(228,87,76,.55); animation: ripple 1.6s ease-out infinite;
  }
  #rz-mic.listening::after { animation-delay: .5s; }
  @keyframes ripple { 0%{transform:scale(.9);opacity:.9} 100%{transform:scale(1.6);opacity:0} }
  #rz-mic:disabled { opacity: .4; cursor: not-allowed; }
  #rz-mic svg { position: relative; z-index: 1; }
  #rz-mic:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  #rz-send {
    background: linear-gradient(135deg,#C0392B,#922B21); color: #fff; border: none;
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: transform .12s ease, opacity .12s ease;
    box-shadow: 0 4px 12px rgba(192,57,43,.3);
  }
  #rz-send:hover:not(:disabled) { transform: translateY(-1px) rotate(8deg); }
  #rz-send:disabled { opacity: .5; cursor: not-allowed; }
  #rz-send:focus-visible { outline: 2px solid var(--brand-dark); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    #rz-win, .rz-row, .rz-welcome, .rz-dots span, .cursor, #rz-mic.listening::before, #rz-mic.listening::after { animation: none !important; }
  }
</style>
</head>
<body>

<button id="rz-btn" aria-label="Open Rozzgaar AI Assistant">
  <img src="https://rozzgaar.in/assets/image/favicon.svg" alt="Rozzgaar Logo" class="logo-img">
</button>

<div id="rz-win" class="hidden" role="dialog" aria-label="Rozzgaar AI Assistant">
  <div class="rz-head">
    <div class="rz-head-top">
      <div class="rz-head-logo" aria-hidden="true">
        <img src="https://rozzgaar.in/assets/image/favicon.svg" alt="Rozzgaar Logo" class="logo-img">
        <span class="online" aria-hidden="true"></span>
      </div>
      <div class="rz-head-txt">
        <div class="rz-head-title">Rozzgaar AI Assistant</div>
        <div class="rz-head-sub" id="rz-ctx-label">Chapter 1: Building the Founder's Mind</div>
      </div>
      <button id="rz-close" aria-label="Close chat">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="rz-quick" id="rz-quick">
      <button class="rz-chip" data-prompt="Summarize this chapter.">📝 Summarize</button>
      <button class="rz-chip" data-prompt="Generate 10 MCQs from this chapter.">❓ MCQs</button>
      <button class="rz-chip" data-prompt="Give me revision notes for this chapter.">📚 Revision Notes</button>
      <button class="rz-chip" data-prompt="Translate this chapter to Hindi.">🌐 Translate to Hindi</button>
    </div>
  </div>

  <div class="rz-msgs" id="rz-msgs" aria-live="polite">
    <div class="rz-welcome" id="rz-welcome">
      <div class="rz-welcome-logo">
        <img src="https://rozzgaar.in/assets/image/favicon.svg" alt="Rozzgaar Logo">
      </div>
      <div class="rz-welcome-title">Welcome to Rozzgaar AI Assistant 👋</div>
      <div class="rz-welcome-sub">I'm here to help you learn faster. Ask me anything about this chapter, or try one of these:</div>
      <div class="rz-welcome-cards">
        <div class="rz-w-card" tabindex="0" role="button" data-prompt="Summarize this chapter.">
          <div class="rz-w-card-icon">📝</div>
          <div class="rz-w-card-txt">Summarize this chapter</div>
        </div>
        <div class="rz-w-card" tabindex="0" role="button" data-prompt="Generate 10 MCQs from this chapter.">
          <div class="rz-w-card-icon">❓</div>
          <div class="rz-w-card-txt">Generate 10 MCQs</div>
        </div>
        <div class="rz-w-card" tabindex="0" role="button" data-prompt="Give me revision notes for this chapter.">
          <div class="rz-w-card-icon">📚</div>
          <div class="rz-w-card-txt">Give me revision notes</div>
        </div>
        <div class="rz-w-card" tabindex="0" role="button" data-prompt="Translate this chapter to Hindi.">
          <div class="rz-w-card-icon">🌐</div>
          <div class="rz-w-card-txt">Translate to Hindi</div>
        </div>
      </div>
    </div>
  </div>

  <form id="rz-form" class="rz-input-row">
    <div class="rz-input-capsule">
      <input type="text" id="rz-input" placeholder="Ask about this chapter..." autocomplete="off" required />
      <button type="button" id="rz-mic" aria-label="Voice input">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A7 7 0 0 0 19 11z"/></svg>
      </button>
    </div>
    <button type="submit" id="rz-send" aria-label="Send message">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3.4 20.6 21 12 3.4 3.4 5 10.5 15 12 5 13.5z"/></svg>
    </button>
  </form>
</div>

<script>
(function () {
  const API_BASE = window.location.origin;
  const LOGO = "https://rozzgaar.in/assets/image/favicon.svg";
  const SPEAK_ICON = '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12c0-1.77-.77-3.29-2-4.36v8.72c1.23-1.07 2-2.59 2-4.36z"/><path d="M14.5 3.23v2.06c2.89 1.24 5 4.14 5 7.71s-2.11 6.47-5 7.71v2.06c4.01-1.29 7-5.24 7-9.77s-2.99-8.48-7-9.77z"/></svg><span>Listen</span>';
  const STOP_ICON = '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span>Stop</span>';
  const MIC_ICON = '<svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A7 7 0 0 0 19 11z"/></svg>';
  const MIC_STOP_ICON = '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
  const USER_ICON = '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-9 2.2-9 5v3h18v-3c0-2.8-4.6-5-9-5z"/></svg>';

  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function inline(s) {
    let h = esc(s);
    h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
    h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/__(.+?)__/g, "<strong>$1</strong>");
    h = h.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
    return h;
  }

  // Parses the model's markdown-ish reply into clean semantic HTML blocks:
  // headings, horizontal rules, bullet/numbered lists, lettered MCQ options
  // (rendered as option cards), "Correct Answer: X" call-outs, and paragraphs.
  function md(raw) {
    const lines = String(raw).replace(/\r\n/g, "\n").split("\n");
    const blocks = [];
    const RE_HEAD = /^\s{0,3}(#{1,6})\s+(.*)$/;
    const RE_HR = /^\s{0,3}(-{3,}|\*{3,}|_{3,})\s*$/;
    const RE_UL = /^\s{0,3}[-*•]\s+/;
    const RE_OL = /^\s{0,3}\d+[.)]\s+/;
    const RE_OPT = /^\s{0,3}([A-Da-d])[.)]\s+(.*)$/;
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i++; continue; }

      let m = line.match(RE_HEAD);
      if (m) { blocks.push({ type: "h", text: m[2].trim() }); i++; continue; }

      if (RE_HR.test(line)) { blocks.push({ type: "hr" }); i++; continue; }

      if (RE_OPT.test(line)) {
        const items = [];
        while (i < lines.length && RE_OPT.test(lines[i])) {
          const mm = lines[i].match(RE_OPT);
          items.push({ letter: mm[1].toUpperCase(), text: mm[2].trim() });
          i++;
        }
        blocks.push({ type: "opts", items });
        continue;
      }

      if (RE_UL.test(line)) {
        const items = [];
        while (i < lines.length && RE_UL.test(lines[i])) {
          items.push(lines[i].replace(RE_UL, "").trim());
          i++;
        }
        blocks.push({ type: "ul", items });
        continue;
      }

      if (RE_OL.test(line)) {
        const items = [];
        while (i < lines.length && RE_OL.test(lines[i])) {
          items.push(lines[i].replace(RE_OL, "").trim());
          i++;
        }
        blocks.push({ type: "ol", items });
        continue;
      }

      const para = [];
      while (
        i < lines.length && lines[i].trim() &&
        !RE_HEAD.test(lines[i]) && !RE_HR.test(lines[i]) &&
        !RE_OPT.test(lines[i]) && !RE_UL.test(lines[i]) && !RE_OL.test(lines[i])
      ) {
        para.push(lines[i].trim());
        i++;
      }
      const text = para.join(" ");
      const plain = text.replace(/\*\*/g, "").replace(/__/g, "").trim();
      if (/^correct answer\s*:/i.test(plain)) {
        blocks.push({ type: "answer", text: plain });
      } else {
        blocks.push({ type: "p", text });
      }
    }

    return blocks.map(b => {
      if (b.type === "h") return `<p class="rz-h">${inline(b.text)}</p>`;
      if (b.type === "hr") return `<div class="rz-hr"></div>`;
      if (b.type === "ul") return `<ul class="rz-list">${b.items.map(it => `<li>${inline(it)}</li>`).join("")}</ul>`;
      if (b.type === "ol") return `<ol class="rz-list">${b.items.map(it => `<li>${inline(it)}</li>`).join("")}</ol>`;
      if (b.type === "opts") {
        return `<div class="rz-opts">${b.items.map(it =>
          `<div class="rz-opt"><span class="rz-opt-letter">${it.letter}</span><span class="rz-opt-text">${inline(it.text)}</span></div>`
        ).join("")}</div>`;
      }
      if (b.type === "answer") {
        return `<div class="rz-answer"><span class="rz-answer-badge">✓</span>${inline(b.text)}</div>`;
      }
      return `<p>${inline(b.text)}</p>`;
    }).join("");
  }

  function speechClean(raw) {
    return String(raw)
      .replace(/\*\*(.+?)\*\*/g,"$1").replace(/__(.+?)__/g,"$1").replace(/\*(.+?)\*/g,"$1")
      .replace(/`([^`]*)`/g,"$1").replace(/\[([^\]]+)\]\(([^)]+)\)/g,"$1")
      .replace(/^\s{0,3}#{1,6}\s*/gm,"").replace(/^\s{0,3}[-*•]\s+/gm,"").replace(/^\s{0,3}\d+[.)]\s+/gm,"")
      .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F1E6}-\u{1F1FF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}]/gu,"")
      .replace(/[#*_~`>|]/g,"").replace(/\n{2,}/g,". ").replace(/\n/g," ").replace(/\s{2,}/g," ").trim();
  }

  function speechLang(t) { return /[\u0900-\u097F]/.test(t) ? "hi-IN" : "en-IN"; }

  function splitForSpeech(text) {
    const parts = text.split(/(?<=[.!?।॥])\s+/);
    const chunks = [];
    let cur = "";
    parts.forEach(p => {
      p = p.trim();
      if (!p) return;
      if ((cur + " " + p).trim().length > 170) {
        if (cur) chunks.push(cur.trim());
        cur = p;
      } else {
        cur = (cur + " " + p).trim();
      }
    });
    if (cur) chunks.push(cur.trim());
    return chunks.length ? chunks : [text];
  }

  let voices = [];
  function refreshVoices() { voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
  if (window.speechSynthesis) { refreshVoices(); window.speechSynthesis.onvoiceschanged = refreshVoices; }
  function waitForVoices(cb) {
    refreshVoices();
    if (voices.length) { cb(); return; }
    let tries = 0;
    const timer = setInterval(() => {
      refreshVoices();
      tries++;
      if (voices.length || tries > 20) { clearInterval(timer); cb(); }
    }, 150);
  }
  function pickVoice(lang) {
    if (!voices.length) refreshVoices();
    if (!voices.length) return null;
    const base = lang.split("-")[0].toLowerCase();
    return voices.find(v => v.lang && v.lang.toLowerCase() === lang.toLowerCase())
      || voices.find(v => v.lang && v.lang.toLowerCase().startsWith(base) && /in|india/i.test(v.name+v.lang))
      || voices.find(v => v.lang && v.lang.toLowerCase().startsWith(base))
      || (base === "hi" ? voices.find(v => /hindi/i.test(v.name)) : null)
      || voices.find(v => v.default)
      || voices[0]
      || null;
  }

  const speechState = { btn: null, queue: [], idx: 0, keepAlive: null, active: false };
  function setSpeakState(btn, on) {
    btn.innerHTML = on ? STOP_ICON : SPEAK_ICON;
    btn.classList.toggle("on", on);
  }
  function clearKeepAlive() {
    if (speechState.keepAlive) { clearInterval(speechState.keepAlive); speechState.keepAlive = null; }
  }
  function stopSpeaking() {
    clearKeepAlive();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (speechState.btn) setSpeakState(speechState.btn, false);
    speechState.btn = null;
    speechState.queue = [];
    speechState.idx = 0;
    speechState.active = false;
  }
  function speakNextChunk(btn) {
    if (!speechState.active || speechState.btn !== btn) return;
    if (speechState.idx >= speechState.queue.length) { stopSpeaking(); return; }
    const chunkText = speechState.queue[speechState.idx];
    const lang = speechLang(chunkText);
    const u = new SpeechSynthesisUtterance(chunkText);
    const v = pickVoice(lang);
    u.lang = v ? v.lang : lang;
    if (v) u.voice = v;
    u.rate = 0.97;
    u.pitch = 1;
    u.onend = () => { speechState.idx++; speakNextChunk(btn); };
    u.onerror = () => { speechState.idx++; if (speechState.idx < speechState.queue.length) speakNextChunk(btn); else stopSpeaking(); };
    window.speechSynthesis.speak(u);
  }
  function toggleSpeak(raw, btn) {
    if (!window.speechSynthesis) { alert("Voice playback isn't supported in this browser."); return; }
    if (speechState.btn === btn && speechState.active) { stopSpeaking(); return; }
    stopSpeaking();
    const clean = speechClean(raw);
    if (!clean) return;
    const chunks = splitForSpeech(clean);
    waitForVoices(() => {
      speechState.btn = btn;
      speechState.queue = chunks;
      speechState.idx = 0;
      speechState.active = true;
      setSpeakState(btn, true);
      clearKeepAlive();
      speechState.keepAlive = setInterval(() => {
        if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
          window.speechSynthesis.pause();
          window.speechSynthesis.resume();
        }
      }, 12000);
      speakNextChunk(btn);
    });
  }
  function trySpeakCommand(t) {
    const norm = t.trim().toLowerCase().replace(/[.!?।]+$/g, "");
    const commands = ["speak", "speak it", "speak that", "speak this", "read it", "read that", "read this",
      "read it out", "read this out", "say it", "say that", "say this",
      "बोलो", "बोल दो", "पढ़ो", "पढ़ के सुनाओ", "सुनाओ", "इसे पढ़ो", "इसे सुनाओ", "इसे बोलो", "जोर से बोलो", "जोर से पढ़ो"];
    if (commands.includes(norm) || commands.includes(t.trim())) {
      const btns = msgsEl.querySelectorAll(".rz-speak");
      if (btns.length) { const last = btns[btns.length - 1]; if (!last.classList.contains("on")) last.click(); }
      return true;
    }
    return false;
  }

  function sessionId() {
    let id = localStorage.getItem("rz_ai_session_id");
    if (!id) { id = crypto.randomUUID(); localStorage.setItem("rz_ai_session_id", id); }
    return id;
  }
  const SESSION_ID = sessionId();
  const ctx = { courseId: "edp", moduleId: "Module 1", chapterId: "1", chapterTitle: "Chapter 1: Building the Founder's Mind" };

  const btn = document.getElementById("rz-btn");
  const win = document.getElementById("rz-win");
  const closeBtn = document.getElementById("rz-close");
  const msgsEl = document.getElementById("rz-msgs");
  const welcomeEl = document.getElementById("rz-welcome");
  const form = document.getElementById("rz-form");
  const input = document.getElementById("rz-input");
  const sendBtn = document.getElementById("rz-send");
  const quick = document.getElementById("rz-quick");
  const micBtn = document.getElementById("rz-mic");
  const chips = quick.querySelectorAll(".rz-chip");

  function hideWelcome() {
    if (welcomeEl && welcomeEl.parentNode) welcomeEl.remove();
  }

  function addUser(text) {
    const row = document.createElement("div");
    row.className = "rz-row user";
    row.innerHTML = `<div class="rz-av usr">${USER_ICON}</div>`;
    const bub = document.createElement("div");
    bub.className = "rz-bub user";
    bub.textContent = text;
    row.appendChild(bub);
    msgsEl.appendChild(row);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function addBotShell() {
    const row = document.createElement("div");
    row.className = "rz-row bot";
    row.innerHTML = `<div class="rz-av bot"><img src="${LOGO}" alt="Rozzgaar"></div>`;
    const bub = document.createElement("div");
    bub.className = "rz-bub bot";
    const content = document.createElement("div");
    content.className = "rz-content";
    bub.appendChild(content);
    row.appendChild(bub);
    msgsEl.appendChild(row);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    return { bub, content };
  }

  function showTyping(content) {
    content.innerHTML = '<span class="rz-dots"><span></span><span></span><span></span></span>';
  }

  function finalizeBot(bub, content, raw, autoSpeak) {
    const c = content.querySelector(".cursor");
    if (c) c.remove();
    if (!raw.trim()) { content.innerHTML = "<p>No response received.</p>"; return; }
    const speakBtn = document.createElement("button");
    speakBtn.type = "button";
    speakBtn.className = "rz-speak";
    setSpeakState(speakBtn, false);
    speakBtn.addEventListener("click", () => toggleSpeak(raw, speakBtn));
    bub.appendChild(speakBtn);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    if (autoSpeak) toggleSpeak(raw, speakBtn);
  }

  function setBusy(busy) {
    sendBtn.disabled = busy;
    micBtn.disabled = busy;
    input.disabled = busy;
    chips.forEach(c => c.disabled = busy);
  }

  function selectChip(chip) {
    chips.forEach(c => c.classList.remove("selected"));
    chip.classList.add("selected");
    setTimeout(() => chip.classList.remove("selected"), 600);
  }

  async function send(message, opts) {
    opts = opts || {};
    const autoSpeak = !!opts.voice;
    hideWelcome();
    stopSpeaking();
    addUser(message);
    input.value = "";
    setBusy(true);

    const { bub, content } = addBotShell();
    showTyping(content);

    let raw = "";
    let first = false;

    try {
      const res = await fetch(`${API_BASE}/api/chat/stream`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: SESSION_ID,
          course_id: ctx.courseId,
          module_id: ctx.moduleId,
          chapter_id: ctx.chapterId,
          message: message,
        }),
      });

      if (!res.ok || !res.body) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Request failed: ${res.status}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let idx;
        while ((idx = buffer.indexOf("\n\n")) !== -1) {
          const evtRaw = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          if (!evtRaw.startsWith("data:")) continue;
          const jsonStr = evtRaw.slice(5).trim();
          if (!jsonStr) continue;
          let evt;
          try { evt = JSON.parse(jsonStr); } catch (e) { continue; }

          if (evt.type === "chunk") {
            if (!first) { first = true; content.innerHTML = ""; }
            raw += evt.text;
            content.innerHTML = md(raw) + '<span class="cursor"></span>';
            msgsEl.scrollTop = msgsEl.scrollHeight;
          } else if (evt.type === "error") {
            throw new Error(evt.message || "Something went wrong while generating a response.");
          }
        }
      }

      finalizeBot(bub, content, raw, autoSpeak);
    } catch (err) {
      content.innerHTML = "";
      content.textContent = `Error: ${err.message}`;
      bub.classList.add("error");
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  // ---- voice input ----
  let recognition = null, listening = false;
  function micIdle() { micBtn.classList.remove("listening"); micBtn.innerHTML = MIC_ICON; listening = false; }
  function micOn() { micBtn.classList.add("listening"); micBtn.innerHTML = MIC_STOP_ICON; listening = true; }
  function initSpeech() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { micBtn.style.opacity = ".4"; micBtn.title = "Speech recognition not supported"; return; }
    recognition = new SR();
    recognition.lang = "en-IN";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onresult = (e) => {
      const t = e.results[e.results.length - 1][0].transcript.trim();
      micIdle();
      if (!t) return;
      if (trySpeakCommand(t)) return;
      input.value = t;
      setTimeout(() => send(t, { voice: true }), 150);
    };
    recognition.onerror = (e) => { micIdle(); if (e.error === "not-allowed") alert("Microphone access denied. Please allow microphone in browser settings."); };
    recognition.onend = micIdle;
  }
  function toggleListen() {
    if (!recognition) { initSpeech(); if (!recognition) return; }
    if (listening) { recognition.stop(); micIdle(); return; }
    try { recognition.start(); micOn(); }
    catch (e) { if (e.name === "InvalidStateError") { recognition.stop(); micIdle(); } else alert("Could not start voice recognition: " + e.message); }
  }
  initSpeech();
  micBtn.addEventListener("click", toggleListen);

  btn.addEventListener("click", () => {
    win.classList.remove("hidden");
    btn.classList.add("hidden");
    input.focus();
  });

  closeBtn.addEventListener("click", () => {
    win.classList.add("hidden");
    btn.classList.remove("hidden");
    stopSpeaking();
    if (listening && recognition) { try { recognition.stop(); } catch (e) {} micIdle(); }
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const m = input.value.trim();
    if (!m) return;
    send(m);
  });

  quick.addEventListener("click", (e) => {
    const chip = e.target.closest(".rz-chip");
    if (!chip || chip.disabled) return;
    selectChip(chip);
    send(chip.dataset.prompt);
  });

  welcomeEl.addEventListener("click", (e) => {
    const card = e.target.closest(".rz-w-card");
    if (!card) return;
    send(card.dataset.prompt);
  });
  welcomeEl.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const card = e.target.closest(".rz-w-card");
    if (!card) return;
    e.preventDefault();
    send(card.dataset.prompt);
  });
})();
</script>
</body>
