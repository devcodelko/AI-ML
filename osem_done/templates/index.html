<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UP MSME Assistant</title>
<style nonce="{{ csp_nonce }}">
  :root {
    --theme-plum: #700078;
    --theme-plum-dark: #52005b;
    --theme-plum-deep: #43004b;
    --theme-lilac: #d7a8dc;
    --theme-lilac-soft: #f2e4f3;
    --theme-ink: #36003d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  html, body { height: 100%; background: radial-gradient(circle at 20% 15%, #f6dff5 0, transparent 34%), #f8eef8; }

  .toggle-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 64px;
    height: 64px;
    min-width: 64px;
    min-height: 64px;
    border-radius: 50%;
    background: var(--theme-plum);
    box-shadow: 0 8px 24px rgba(112,0,120,0.42), 0 0 0 3px #fff;
    padding: 0;
    border: none;
    overflow: visible;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .toggle-btn:hover { transform: scale(1.07); box-shadow: 0 10px 28px rgba(112,0,120,0.5), 0 0 0 3px #fff; }
  .toggle-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--theme-plum);
    animation: toggle-ping 2.4s ease-out infinite;
    pointer-events: none;
  }
  .toggle-btn.open::before { display: none; }
  .toggle-btn svg.brand-logo { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; flex: none; fill: initial; border-radius: 50%; pointer-events: none; }
  .toggle-btn.open svg.brand-logo { display: none; }
  .toggle-btn svg { display: block; width: 24px; height: 24px; max-width: 24px; max-height: 24px; flex: 0 0 24px; fill: #fff; }
  .toggle-btn .icon-chat { width: 46px; height: 46px; max-width: 46px; max-height: 46px; flex-basis: 46px; fill: none; }
  .toggle-btn .icon-close { display: none; }
  .toggle-btn.open .icon-chat { display: none; }
  .toggle-btn.open .icon-close { display: block; }

  .welcome-bubble {
    position: fixed;
    bottom: 34px;
    right: 102px;
    max-width: 250px;
    background: #fff;
    color: var(--theme-ink);
    border: 1px solid #e6cde7;
    border-radius: 16px 16px 4px 16px;
    padding: 11px 32px 11px 14px;
    box-shadow: 0 10px 30px rgba(67,0,75,0.22);
    z-index: 998;
    opacity: 0;
    transform: translateX(14px) scale(0.95);
    transform-origin: bottom right;
    animation: bubble-in 0.5s ease 1.2s forwards;
  }
  .welcome-bubble::after {
    content: '';
    position: absolute;
    right: -7px;
    bottom: 14px;
    width: 12px;
    height: 12px;
    background: #fff;
    border-right: 1px solid #e6cde7;
    border-top: 1px solid #e6cde7;
    transform: rotate(45deg);
  }
  .welcome-bubble.dismissed { display: none; }
  .toggle-btn.open + .welcome-bubble { display: none; }
  .welcome-title { font-size: 13.5px; font-weight: 700; color: var(--theme-plum-dark); line-height: 1.35; }
  .welcome-sub { font-size: 12px; line-height: 1.45; margin-top: 3px; color: #5c3a62; }
  .welcome-close {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 20px;
    height: 20px;
    border: none;
    border-radius: 50%;
    background: var(--theme-lilac-soft);
    color: var(--theme-plum);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }
  .welcome-close:hover { background: #ead2eb; }

  .chat-widget {
    position: fixed;
    bottom: 100px;
    right: 24px;
    width: 390px;
    max-width: calc(100vw - 32px);
    height: min(660px, calc(100vh - 136px));
    min-height: 430px;
    background: #fffaff;
    border-radius: 20px;
    border: 1px solid rgba(148,163,184,0.28);
    box-shadow: 0 20px 55px rgba(15,23,42,0.24), 0 4px 12px rgba(15,23,42,0.08);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: scale(0.9) translateY(12px);
    opacity: 0;
    pointer-events: none;
    transform-origin: bottom right;
    transition: transform 0.18s ease, opacity 0.18s ease;
    z-index: 999;
  }
  .chat-widget.open {
    transform: scale(1) translateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  .chat-header { background: linear-gradient(135deg, var(--theme-plum-deep), var(--theme-plum)); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .chat-header-main { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .header-avatar {
    position: relative;
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid rgba(255,255,255,0.85);
  }
  .header-avatar svg { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; }
  .header-avatar::after {
    content: '';
    position: absolute;
    right: -1px;
    bottom: -1px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #22c55e;
    border: 2px solid var(--theme-plum);
  }
  .chat-header-text { min-width: 0; }
  .chat-header-text h1 { font-size: 14px; line-height: 1.35; font-weight: 700; }
  .chat-header-text p { font-size: 10.5px; line-height: 1.4; opacity: 0.78; margin-top: 3px; }

  .chat-header-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .header-btn {
    background: rgba(255,255,255,0.16);
    border: none;
    color: #fff;
    border-radius: 14px;
    height: 26px;
    padding: 0 9px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: background 0.15s ease;
  }
  .header-btn:hover { background: rgba(255,255,255,0.3); }
  .header-btn svg { width: 14px; height: 14px; fill: #fff; }
  .header-btn.active { background: #fff; color: var(--theme-plum); }
  .header-btn.active svg { fill: var(--theme-plum); }

  .lang-switch { display: flex; background: rgba(255,255,255,0.16); border-radius: 14px; padding: 2px; gap: 2px; }
  .lang-btn { background: transparent; border: none; color: #fff; border-radius: 12px; height: 22px; padding: 0 9px; font-size: 11px; font-weight: 700; cursor: pointer; transition: background 0.15s ease, color 0.15s ease; }
  .lang-btn.active { background: #fff; color: var(--theme-plum); }

  .chat-messages { flex: 1; padding: 16px 14px; overflow-y: auto; background: var(--theme-lilac-soft); display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-thumb { background: #d4a9d7; border-radius: 6px; }
  .message { max-width: 90%; padding: 10px 12px; border-radius: 13px; font-size: 15px; line-height: 1.55; overflow-wrap: anywhere; word-break: break-word; box-shadow: 0 1px 2px rgba(15,23,42,0.04); animation: msg-in 0.22s ease; }
  .message.user { align-self: flex-end; background: linear-gradient(135deg, var(--theme-plum), var(--theme-plum-dark)); color: #fff; border-bottom-right-radius: 4px; }
  .message.bot { align-self: flex-start; background: #fff; color: var(--theme-ink); border: 1px solid #e6cde7; border-bottom-left-radius: 4px; }
  .message.typing { align-self: flex-start; background: #ead2eb; color: var(--theme-plum-dark); font-style: italic; }
  .message.bot strong { font-weight: 700; color: var(--theme-plum-dark); }
  .message.bot em { font-style: italic; }
  .message.bot h2, .message.bot h3 { font-size: 16px; margin: 0 0 5px; }
  .message.bot ul, .message.bot ol { margin: 5px 0 5px 18px; padding: 0; }
  .message.bot li { margin: 3px 0; }
  .message.bot p { margin: 0 0 7px; }
  .message.bot p:last-child { margin-bottom: 0; }
  .message.bot a { color: var(--theme-plum); text-decoration: underline; font-weight: 600; }
  .message.bot-content { position: relative; padding-bottom: 32px; }

  .speak-btn {
    position: absolute;
    left: 10px;
    bottom: 6px;
    width: 24px;
    height: 24px;
    min-width: 24px;
    border-radius: 50%;
    border: 1px solid #d4a9d7;
    background: var(--theme-lilac-soft);
    color: var(--theme-plum);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .speak-btn:hover { background: #ead2eb; border-color: var(--theme-plum); }
  .speak-btn svg { width: 13px; height: 13px; fill: var(--theme-plum); }
  .speak-btn .icon-stop { display: none; }
  .speak-btn.speaking { background: #dc2626; border-color: #b91c1c; animation: mic-pulse 1s infinite; }
  .speak-btn.speaking .icon-speaker { display: none; }
  .speak-btn.speaking .icon-stop { display: block; }
  .speak-btn.speaking svg { fill: #fff; }
  .speak-btn.loading { opacity: 0.55; cursor: wait; }

  .chat-input { position: relative; display: flex; padding: 12px; gap: 7px; border-top: 1px solid #e6cde7; background: #fffaff; align-items: center; }
  .chat-input input { flex: 1; min-width: 0; padding: 10px 13px; border: 1px solid #d4a9d7; border-radius: 20px; font-size: 12.5px; outline: none; background: #fff; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
  .chat-input input:focus { border-color: var(--theme-plum); box-shadow: 0 0 0 3px rgba(112,0,120,0.12); }
  .chat-input button#sendBtn { background: linear-gradient(135deg, var(--theme-plum), var(--theme-plum-dark)); color: #fff; border: none; min-height: 36px; padding: 0 16px; border-radius: 20px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: opacity 0.15s ease, transform 0.15s ease; }
  .chat-input button#sendBtn:hover { opacity: 0.92; transform: translateY(-1px); }
  .chat-input button:disabled { opacity: 0.6; cursor: not-allowed; }

  .mic-btn {
    background: var(--theme-lilac-soft);
    border: 1px solid #d4a9d7;
    color: var(--theme-plum);
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .mic-btn svg { width: 17px; height: 17px; fill: var(--theme-plum); }
  .mic-btn:hover { background: #ead2eb; border-color: var(--theme-plum); }
  .mic-btn.listening { background: #dc2626; border-color: #b91c1c; animation: mic-pulse 1s infinite; }
  .mic-btn.listening svg { fill: #fff; }
  .mic-btn[hidden] { display: none; }
  .voice-status { display: none; position: absolute; right: 12px; bottom: 59px; padding: 5px 9px; border-radius: 10px; background: #991b1b; color: #fff; font-size: 10px; font-weight: 600; box-shadow: 0 4px 12px rgba(127,29,29,0.22); }
  .voice-status.visible { display: block; }

  @media (max-width: 520px) {
    .toggle-btn { right: 16px; bottom: 16px; width: 60px; height: 60px; min-width: 60px; min-height: 60px; }
    .welcome-bubble { right: 88px; bottom: 24px; max-width: calc(100vw - 112px); }
    .chat-widget { right: 16px; bottom: 90px; width: calc(100vw - 32px); height: calc(100vh - 112px); min-height: 400px; }
  }

  @media (max-height: 560px) and (orientation: landscape) {
    .chat-widget { height: calc(100vh - 92px); min-height: 360px; }
  }

  @keyframes mic-pulse {
    0% { box-shadow: 0 0 0 0 rgba(220,38,38,0.45); }
    70% { box-shadow: 0 0 0 8px rgba(220,38,38,0); }
    100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
  }
  @keyframes toggle-ping {
    0% { transform: scale(1); opacity: 0.6; }
    80%, 100% { transform: scale(1.55); opacity: 0; }
  }
  @keyframes bubble-in {
    to { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="brandLogo" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="31" fill="#ffffff"/>
    <circle cx="32" cy="32" r="27" fill="none" stroke="#700078" stroke-width="3"/>
    <rect x="18" y="30" width="6" height="12" rx="1.5" fill="#d7a8dc"/>
    <rect x="29" y="24" width="6" height="18" rx="1.5" fill="#a24aab"/>
    <rect x="40" y="18" width="6" height="24" rx="1.5" fill="#700078"/>
    <rect x="15" y="43.5" width="34" height="2.2" rx="1.1" fill="#700078"/>
    <text x="32" y="54" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.8" fill="#700078">OSEM</text>
  </symbol>
</svg>

<button class="toggle-btn" id="toggleBtn" aria-label="Open chatbot">
  <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#brandLogo"></use></svg>
  <svg class="icon-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
</button>

<div class="welcome-bubble" id="welcomeBubble">
  <button class="welcome-close" id="welcomeClose" type="button" aria-label="Close">&times;</button>
  <div class="welcome-title" id="welcomeTitle">&#128075; Namaste! How can I help you?</div>
  <div class="welcome-sub" id="welcomeSub">Ask about MSMEOSEM, CM Yuva &amp; CM Youth Adda.</div>
</div>

<div class="chat-widget" id="chatWidget">
  <div class="chat-header">
    <div class="chat-header-main">
      <div class="header-avatar" aria-hidden="true"><svg viewBox="0 0 64 64"><use href="#brandLogo"></use></svg></div>
      <div class="chat-header-text">
        <h1>Skill Development Assistant</h1>
        <p>Online &bull; Here to help you</p>
      </div>
    </div>
    <div class="chat-header-controls">
      <div class="lang-switch">
        <button class="lang-btn active" id="langEnBtn" type="button" data-lang="en">EN</button>
        <button class="lang-btn" id="langHiBtn" type="button" data-lang="hi">हिं</button>
      </div>
    </div>
  </div>
  <div class="chat-messages" id="messages">
    <div class="message bot" id="initialGreeting">Namaste! Ask me anything about MSMEOSEM, CM Yuva, CM Youth Adda.</div>
  </div>
  <div class="chat-input">
    <div class="voice-status" id="voiceStatus" aria-live="polite">Listening...</div>
    <input type="text" id="userInput" placeholder="Type your question..." autocomplete="off" maxlength="500">
    <button class="mic-btn" id="micBtn" type="button" title="Ask by speaking" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <button id="sendBtn">Send</button>
  </div>
</div>

<script nonce="{{ csp_nonce }}">
const toggleBtn = document.getElementById('toggleBtn');
const chatWidget = document.getElementById('chatWidget');
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const voiceStatus = document.getElementById('voiceStatus');
const langEnBtn = document.getElementById('langEnBtn');
const langHiBtn = document.getElementById('langHiBtn');
const initialGreetingEl = document.getElementById('initialGreeting');

let isListening = false;

const UI_TEXT = {
  en: {
    greeting: 'Namaste! Ask me anything about MSMEOSEM, CM Yuva, CM Youth Adda.',
    placeholder: 'Type your question...',
    typing: 'Typing...',
    listening: 'Listening...',
    send: 'Send',
    micTitle: 'Ask by speaking',
    greetingReply: 'Hello, how can I assist you?',
    errorPrefix: 'Error: ',
    errorUnavailable: 'The assistant is temporarily unavailable. Please try again.',
    errorNoResponse: 'I could not generate a response. Please try again.',
    speechLang: 'en-IN',
    speakTitle: 'Listen to this reply',
    stopTitle: 'Stop speaking',
  },
  hi: {
    greeting: 'नमस्ते! MSMEOSEM, CM Yuva, CM Youth Adda से जुड़ा कोई भी सवाल पूछें।',
    placeholder: 'अपना सवाल लिखें...',
    typing: 'लिख रहे हैं...',
    listening: 'सुन रहे हैं...',
    send: 'भेजें',
    micTitle: 'बोलकर पूछें',
    greetingReply: 'नमस्ते, मैं आपकी किस प्रकार सहायता कर सकता/सकती हूँ?',
    errorPrefix: 'त्रुटि: ',
    errorUnavailable: 'सहायक अभी उपलब्ध नहीं है। कृपया दोबारा प्रयास करें।',
    errorNoResponse: 'मैं जवाब नहीं दे सका/सकी। कृपया दोबारा प्रयास करें।',
    speechLang: 'hi-IN',
    speakTitle: 'जवाब सुनें',
    stopTitle: 'बोलना रोकें',
  },
};

let currentLang = (localStorage.getItem('msme_chat_lang') === 'hi') ? 'hi' : 'en';

function applyLanguage(lang, isInitial) {
  currentLang = lang === 'hi' ? 'hi' : 'en';
  localStorage.setItem('msme_chat_lang', currentLang);
  const text = UI_TEXT[currentLang];
  langEnBtn.classList.toggle('active', currentLang === 'en');
  langHiBtn.classList.toggle('active', currentLang === 'hi');
  inputEl.placeholder = text.placeholder;
  sendBtn.textContent = text.send;
  micBtn.title = text.micTitle;
  micBtn.setAttribute('aria-label', text.micTitle);
  voiceStatus.textContent = text.listening;
  if (recognition) recognition.lang = text.speechLang;
  if (isInitial && initialGreetingEl) initialGreetingEl.textContent = text.greeting;
}

langEnBtn.addEventListener('click', function () { applyLanguage('en', false); });
langHiBtn.addEventListener('click', function () { applyLanguage('hi', false); });

toggleBtn.addEventListener('click', function () {
  chatWidget.classList.toggle('open');
  toggleBtn.classList.toggle('open');
  if (chatWidget.classList.contains('open')) {
    inputEl.focus();
  } else {
    stopSpeech();
  }
});

/* ---------- Text-to-speech: auto-speak bot replies with a stop control ---------- */

const SPEAKER_ICON_SVG = '<svg class="icon-speaker" viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12z"/><path d="M14 4.13v2.06a7 7 0 0 1 0 11.62v2.06a9 9 0 0 0 0-15.74z"/></svg>';
const STOP_ICON_SVG = '<svg class="icon-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>';

let currentAudio = null;
let currentSpeakBtn = null;
let currentPlayResolve = null;
let speakToken = 0;
const audioBlobCache = new Map();

function resetSpeakBtn(btn) {
  if (!btn) return;
  btn.classList.remove('speaking', 'loading');
  btn.title = UI_TEXT[currentLang].speakTitle;
  btn.setAttribute('aria-label', UI_TEXT[currentLang].speakTitle);
}

function stopSpeech() {
  speakToken += 1;
  if (currentAudio) {
    try {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    } catch (err) { /* ignore */ }
  }
  if (currentPlayResolve) {
    const resolvePlay = currentPlayResolve;
    currentPlayResolve = null;
    resolvePlay();
  }
  resetSpeakBtn(currentSpeakBtn);
  currentAudio = null;
  currentSpeakBtn = null;
}

function splitSpeechText(html) {
  const clean = String(html || '')
    .replace(/<[^>]*>/g, ' ')
    .replace(/https?:\/\/\S+/g, ' ')
    .replace(/[*_#`~|^]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  if (!clean) return [];
  const sentences = clean.match(/[^.!?।]+[.!?।]+["')\]]*\s*|[^.!?।]+$/g) || [clean];
  const chunks = [];
  let current = '';

  function limit() {
    if (chunks.length === 0) return 120;
    if (chunks.length === 1) return 260;
    return 420;
  }
  function pushCurrent() {
    if (current.trim()) chunks.push(current.trim());
    current = '';
  }

  sentences.forEach(function (sentence) {
    let rest = sentence.trim();
    while (rest) {
      const max = limit();
      const joined = (current + ' ' + rest).trim();
      if (joined.length <= max) {
        current = joined;
        rest = '';
      } else if (current) {
        pushCurrent();
      } else {
        let cut = rest.lastIndexOf(',', max);
        let keep = cut + 1;
        if (cut < max * 0.4) {
          cut = rest.lastIndexOf(' ', max);
          keep = cut;
        }
        if (cut <= 0) {
          cut = max;
          keep = max;
        }
        current = rest.slice(0, keep).trim();
        rest = rest.slice(cut + (rest.charAt(cut) === ',' ? 1 : 0)).trim();
        pushCurrent();
      }
    }
  });
  pushCurrent();
  return chunks;
}

function fetchAudioBlob(text, lang) {
  const key = lang + '\u0000' + text;
  if (audioBlobCache.has(key)) return audioBlobCache.get(key);
  const promise = fetch('/speak', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: text, lang: lang }),
    signal: AbortSignal.timeout(60000),
  }).then(function (response) {
    if (!response.ok) throw new Error('speak failed');
    return response.blob();
  }).catch(function (err) {
    audioBlobCache.delete(key);
    throw err;
  });
  audioBlobCache.set(key, promise);
  return promise;
}

function playAudio(audio) {
  return new Promise(function (resolve) {
    const done = function () {
      audio.removeEventListener('ended', done);
      audio.removeEventListener('error', done);
      if (currentPlayResolve === done) currentPlayResolve = null;
      resolve();
    };
    currentPlayResolve = done;
    audio.addEventListener('ended', done);
    audio.addEventListener('error', done);
    audio.play().catch(done);
  });
}

async function speakText(text, lang, btn) {
  if (currentSpeakBtn === btn) {
    stopSpeech();
    return;
  }
  stopSpeech();
  const chunks = splitSpeechText(text);
  if (!chunks.length) return;
  const token = speakToken;
  currentSpeakBtn = btn;
  btn.classList.add('loading');

  const audioPromises = [];
  const objectUrls = [];

  function getAudio(index) {
    if (index >= chunks.length) return null;
    if (!audioPromises[index]) {
      audioPromises[index] = fetchAudioBlob(chunks[index], lang).then(function (blob) {
        if (token !== speakToken) return null;
        const objectUrl = URL.createObjectURL(blob);
        objectUrls.push(objectUrl);
        const audio = new Audio(objectUrl);
        audio.preload = 'auto';
        return audio;
      });
      audioPromises[index].catch(function () { /* handled where awaited */ });
    }
    return audioPromises[index];
  }

  try {
    getAudio(0);
    getAudio(1);
    for (let i = 0; i < chunks.length; i += 1) {
      const audio = await getAudio(i);
      if (token !== speakToken || !audio) return;
      getAudio(i + 1);
      getAudio(i + 2);
      currentAudio = audio;
      if (i === 0) {
        btn.classList.remove('loading');
        btn.classList.add('speaking');
        btn.title = UI_TEXT[currentLang].stopTitle;
        btn.setAttribute('aria-label', UI_TEXT[currentLang].stopTitle);
      }
      await playAudio(audio);
      if (token !== speakToken) return;
    }
  } catch (err) {
    /* stop silently */
  } finally {
    objectUrls.forEach(function (objectUrl) { URL.revokeObjectURL(objectUrl); });
    if (token === speakToken) {
      currentAudio = null;
      currentSpeakBtn = null;
      resetSpeakBtn(btn);
    }
  }
}

function createSpeakButton(text, lang) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'speak-btn';
  btn.title = UI_TEXT[currentLang].speakTitle;
  btn.setAttribute('aria-label', UI_TEXT[currentLang].speakTitle);
  btn.innerHTML = SPEAKER_ICON_SVG + STOP_ICON_SVG;
  btn.addEventListener('click', function (event) {
    event.stopPropagation();
    speakText(text, lang, btn);
  });
  return btn;
}

async function animateAndSpeak(container, text, lang) {
  const btn = createSpeakButton(text, lang);
  speakText(text, lang, btn);
  await animateBotHtml(container, text);
  container.appendChild(btn);
}

/* ---------- Chat rendering ---------- */

function addMessage(text, sender) {
  const div = document.createElement('div');
  div.className = 'message ' + sender;
  if (sender === 'bot') {
    div.classList.add('bot-content');
    renderBotHtml(div, text);
  } else {
    div.textContent = text;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function convertMarkdownFormatting(html) {
  return html
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<em>$2</em>');
}

function appendFormattedText(parent, text) {
  const formattingPattern = /(\*\*[^*]+\*\*|\*[^*]+\*)/g;
  let cursor = 0;
  let match;
  while ((match = formattingPattern.exec(text)) !== null) {
    if (match.index > cursor) {
      parent.appendChild(document.createTextNode(text.slice(cursor, match.index)));
    }
    const marker = match[0];
    const isBold = marker.startsWith('**');
    const formatted = document.createElement(isBold ? 'strong' : 'em');
    formatted.textContent = marker.slice(isBold ? 2 : 1, isBold ? -2 : -1);
    parent.appendChild(formatted);
    cursor = match.index + marker.length;
  }
  if (cursor < text.length) {
    parent.appendChild(document.createTextNode(text.slice(cursor)));
  }
}

function appendTextWithLinks(parent, text) {
  const urlPattern = /https:\/\/[^\s<>"]+/gi;
  let cursor = 0;
  let match;
  while ((match = urlPattern.exec(text)) !== null) {
    if (match.index > cursor) {
      appendFormattedText(parent, text.slice(cursor, match.index));
    }
    const trailingPunctuation = match[0].match(/[.,;:!?)]$/);
    const url = trailingPunctuation ? match[0].slice(0, -1) : match[0];
    const link = document.createElement('a');
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = new URL(url).hostname.replace(/^www\./i, '');
    parent.appendChild(link);
    if (trailingPunctuation) {
      parent.appendChild(document.createTextNode(trailingPunctuation[0]));
    }
    cursor = match.index + match[0].length;
  }
  if (cursor < text.length) {
    appendFormattedText(parent, text.slice(cursor));
  }
}

function renderBotHtml(container, html) {
  const template = document.createElement('template');
  template.innerHTML = convertMarkdownFormatting(html);
  const allowedTags = new Set(['A', 'BR', 'EM', 'H2', 'H3', 'LI', 'OL', 'P', 'STRONG', 'UL']);

  function copyNode(node, parent) {
    if (node.nodeType === Node.TEXT_NODE) {
      if (parent.tagName === 'A') {
        appendFormattedText(parent, node.nodeValue);
      } else {
        appendTextWithLinks(parent, node.nodeValue);
      }
      return;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return;
    if (!allowedTags.has(node.tagName)) {
      Array.from(node.childNodes).forEach(child => copyNode(child, parent));
      return;
    }
    const cleanNode = document.createElement(node.tagName.toLowerCase());
    if (node.tagName === 'A' && /^https:\/\//i.test(node.getAttribute('href') || '')) {
      cleanNode.href = node.getAttribute('href');
      cleanNode.target = '_blank';
      cleanNode.rel = 'noopener noreferrer';
    }
    Array.from(node.childNodes).forEach(child => copyNode(child, cleanNode));
    if (node.tagName === 'A' && cleanNode.href) {
      cleanNode.textContent = new URL(cleanNode.href).hostname.replace(/^www\./i, '');
    }
    parent.appendChild(cleanNode);
  }

  Array.from(template.content.childNodes).forEach(node => copyNode(node, container));
}

function wait(milliseconds) {
  return new Promise(resolve => setTimeout(resolve, milliseconds));
}

async function animateBotHtml(container, html) {
  const template = document.createElement('template');
  template.innerHTML = convertMarkdownFormatting(html);
  const allowedTags = new Set(['A', 'BR', 'EM', 'H2', 'H3', 'LI', 'OL', 'P', 'STRONG', 'UL']);

  async function copyNode(node, parent) {
    if (node.nodeType === Node.TEXT_NODE) {
      const formattingPattern = /(\*\*[^*]+\*\*|\*[^*]+\*)/g;
      let cursor = 0;
      let match;
      while ((match = formattingPattern.exec(node.nodeValue)) !== null) {
        const words = node.nodeValue.slice(cursor, match.index).split(/(\s+)/);
        for (const word of words) {
          parent.appendChild(document.createTextNode(word));
          messagesEl.scrollTop = messagesEl.scrollHeight;
          if (word.trim()) await wait(18);
        }
        const marker = match[0];
        const formatted = document.createElement(marker.startsWith('**') ? 'strong' : 'em');
        formatted.textContent = marker.slice(marker.startsWith('**') ? 2 : 1, marker.startsWith('**') ? -2 : -1);
        parent.appendChild(formatted);
        cursor = match.index + marker.length;
      }
      const remainingWords = node.nodeValue.slice(cursor).split(/(\s+)/);
      for (const word of remainingWords) {
        parent.appendChild(document.createTextNode(word));
        messagesEl.scrollTop = messagesEl.scrollHeight;
        if (word.trim()) await wait(18);
      }
      return;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return;
    if (!allowedTags.has(node.tagName)) {
      for (const child of node.childNodes) await copyNode(child, parent);
      return;
    }
    const cleanNode = document.createElement(node.tagName.toLowerCase());
    if (node.tagName === 'A' && /^https:\/\//i.test(node.getAttribute('href') || '')) {
      cleanNode.href = node.getAttribute('href');
      cleanNode.target = '_blank';
      cleanNode.rel = 'noopener noreferrer';
    }
    parent.appendChild(cleanNode);
    for (const child of node.childNodes) await copyNode(child, cleanNode);
    if (node.tagName === 'A' && cleanNode.href) {
      cleanNode.textContent = new URL(cleanNode.href).hostname.replace(/^www\./i, '');
    }
  }

  for (const node of template.content.childNodes) await copyNode(node, container);
  linkifyTextNodes(container);
}

function linkifyTextNodes(container) {
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  const textNodes = [];
  let node;
  while ((node = walker.nextNode())) {
    if (node.parentElement && node.parentElement.closest('a')) continue;
    if (/https:\/\/[^\s<>" ]+/i.test(node.nodeValue)) textNodes.push(node);
  }
  textNodes.forEach(textNode => {
    const fragment = document.createDocumentFragment();
    appendTextWithLinks(fragment, textNode.nodeValue);
    textNode.replaceWith(fragment);
  });
}

function isGreeting(text) {
  const normalizedText = text.toLowerCase().replace(/[!?,.]+/g, ' ').replace(/\s+/g, ' ').trim();
  return /^(hi|hii|hello|helo|hey|namaste|namaskar|good morning|good afternoon|good evening|good night|नमस्ते|नमस्कार|हाय|हेलो|हैलो|शुभ प्रभात|शुभ संध्या)$/.test(normalizedText);
}

async function sendMessage() {
  const text = inputEl.value.trim().slice(0, 500);
  if (!text) return;
  stopSpeech();
  inputEl.value = '';
  sendBtn.disabled = true;
  addMessage(text, 'user');

  if (isGreeting(text)) {
    const greetingReply = UI_TEXT[currentLang].greetingReply;
    const greetingEl = addMessage('', 'bot');
    await animateAndSpeak(greetingEl, greetingReply, currentLang);
    sendBtn.disabled = false;
    inputEl.focus();
    return;
  }

  const typingEl = addMessage(UI_TEXT[currentLang].typing, 'typing');

  try {
    let response;
    let lastError;
    for (let attempt = 0; attempt < 2; attempt += 1) {
      try {
        response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, lang: currentLang }),
          signal: AbortSignal.timeout(90000)
        });
        if (response.ok || (response.status < 500 && response.status !== 408)) break;
      } catch (err) {
        lastError = err;
      }
      if (attempt === 0) await wait(700);
    }
    if (!response) throw lastError || new Error('Request failed');
    const data = await response.json().catch(() => ({}));
    typingEl.remove();
    if (!response.ok || data.error) {
      addMessage(UI_TEXT[currentLang].errorPrefix + (data.error || UI_TEXT[currentLang].errorUnavailable), 'bot');
    } else {
      const answerEl = addMessage('', 'bot');
      const answerText = data.answer || UI_TEXT[currentLang].errorNoResponse;
      const answerLang = (data.lang === 'hi' || data.lang === 'en') ? data.lang : currentLang;
      if (data.answer) {
        await animateAndSpeak(answerEl, answerText, answerLang);
      } else {
        await animateBotHtml(answerEl, answerText);
      }
    }
  } catch (err) {
    typingEl.remove();
    addMessage(UI_TEXT[currentLang].errorUnavailable, 'bot');
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') sendMessage();
});

const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let finalTranscript = '';

function repairSpeechText(text) {
  if (!text) return '';
  let repaired = text.trim();
  const replacements = [
    [/\b(oecm|oecm\b)/gi, 'OSEM'],
    [/\b(osm|o s m|o-s-m)\b/gi, 'OSEM'],
    [/\b(up on|upon|up-on)\b/gi, 'UPON'],
    [/\b(osem|osem\b)/gi, 'OSEM'],
    [/\b(cmyuva|cm yuva|cm yuvaa)\b/gi, 'CM Yuva'],
    [/\b(cmyouthadda|cm youth adda|cm youth adda)\b/gi, 'CM Youth Adda'],
    [/\b(msm e|msme)\b/gi, 'MSME'],
    [/\b(up i con|upicon|u p i c o n)\b/gi, 'UPICON'],
    [/\s+/g, ' '],
  ];
  replacements.forEach(([pattern, replacement]) => {
    repaired = repaired.replace(pattern, replacement);
  });
  return repaired.trim();
}

function normalizeSpeechTranscript(text) {
  const cleaned = (text || '')
    .replace(/[^a-zA-Z0-9\u0900-\u097F\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  return repairSpeechText(cleaned);
}

function chooseBestSpeechResult(resultList) {
  if (!resultList || !resultList.length) return '';
  let bestText = '';
  let bestConfidence = -1;
  for (let i = 0; i < resultList.length; i += 1) {
    const alt = resultList[i];
    const transcript = (alt && alt.transcript ? alt.transcript : '').trim();
    if (!transcript) continue;
    const confidence = Number(alt.confidence || 0);
    if (confidencesAreBetter(confidence, bestConfidence) || (!bestText && transcript)) {
      bestText = transcript;
      bestConfidence = confidence;
    }
  }
  return normalizeSpeechTranscript(bestText);
}

function confidencesAreBetter(candidateConfidence, currentBestConfidence) {
  if (candidateConfidence <= 0) return false;
  if (currentBestConfidence < 0) return true;
  return candidateConfidence > currentBestConfidence;
}

if (SpeechRecognitionImpl) {
  micBtn.hidden = false;
  recognition = new SpeechRecognitionImpl();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 5;

  recognition.addEventListener('result', function (event) {
    const bestTranscript = chooseBestSpeechResult(event.results && event.results[event.results.length - 1]);
    if (bestTranscript) {
      finalTranscript = bestTranscript;
      inputEl.value = bestTranscript;
    }
  });

  recognition.addEventListener('end', function () {
    isListening = false;
    micBtn.classList.remove('listening');
    voiceStatus.classList.remove('visible');
    const finalText = finalTranscript.trim();
    finalTranscript = '';
    if (finalText) {
      inputEl.value = finalText;
      sendMessage();
    }
  });

  recognition.addEventListener('error', function () {
    isListening = false;
    micBtn.classList.remove('listening');
    voiceStatus.classList.remove('visible');
    finalTranscript = '';
  });

  micBtn.addEventListener('click', function () {
    if (isListening) {
      recognition.stop();
      return;
    }
    stopSpeech();
    finalTranscript = '';
    recognition.lang = UI_TEXT[currentLang].speechLang;
    try {
      recognition.start();
      isListening = true;
      micBtn.classList.add('listening');
      voiceStatus.classList.add('visible');
    } catch (err) {
      isListening = false;
      micBtn.classList.remove('listening');
      voiceStatus.classList.remove('visible');
      finalTranscript = '';
    }
  });
} else {
  micBtn.hidden = true;
}

applyLanguage(currentLang, true);
</script>
